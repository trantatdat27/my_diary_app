name: my_diary_app
description: "A new Flutter project for Personal Diary using Firebase."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # --- THƯ VIỆN FIREBASE ---
  firebase_core: ^3.0.0      # Cần thiết để khởi tạo Firebase
  cloud_firestore: ^5.0.0    # Database đám mây (thay thế cho sqflite)
  # --- THƯ VIỆN HỖ TRỢ ---
  intl: ^0.18.1           # Định dạng ngày giờ
  path: ^1.9.0               # Quản lý đường dẫn (vẫn nên để lại để dự phòng)
  provider: ^6.1.1
  table_calendar: ^3.0.9
  firebase_auth: ^5.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
